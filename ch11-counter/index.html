<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool counter</title>
</head>

<body>
    <script>
        function makeCounter() {
            let count = 0;
            let countObj = {
                increment: function () {
                    count++;
                    return count;
                }
            }
            return countObj;
        }
        let doCount = makeCounter().increment;
        console.log(doCount());
        console.log(doCount());
        console.log(doCount());

    </script>
</body>

</html>
