<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee!</title>
</head>

<body>
    <script>
        function Coffee(roast, ounces) {
            this.roast = roast;
            this.ounces = ounces;
            this.getSize = function () {
                if (ounces === 8) {
                    return "small";
                } else if (ounces === 12) {
                    return "medium";
                } else if (ounces === 16) {
                    return "large";
                } else {
                    return "non-standard size";
                }
            }
            this.toString = function () {
                return "You've ordered a " + this.getSize()
                    + " " + this.roast
                    + " blend coffee.";
            }
        }
        let houseBlend = new Coffee("House blend", 12);
        console.log(houseBlend.toString());

        let darkRoast = new Coffee("Dark roast", 16);
        console.log(darkRoast.toString());
    </script>
</body>

</html>
